services:
  layervault:
    build: .
    restart: unless-stopped
    depends_on:
      sketchforge:
        condition: service_started
    ports:
      # Trusted home/workshop LAN only. Do not publish directly to the internet.
      - "8088:8080"
    environment:
      TZ: ${LAYERVAULT_TIMEZONE:-Europe/London}
      DATA_DIR: /data
      DATABASE_DIR: /storage/database
      FILES_DIR: /storage/models
      BACKUP_DIR: /storage/backups
      SKETCHFORGE_PROJECTS_DIR: /data/sketchforge/projects
      STORAGE_CONFIG_FILE: /config/storage.json
      STORAGE_RESTART_ON_APPLY: "true"
      STORAGE_ROOT_1_HOST: ${LAYERVAULT_DATA_PATH:-./data}
      STORAGE_ROOT_1_CONTAINER: /storage-roots/1
      STORAGE_ROOT_2_HOST: ${LAYERVAULT_DATABASE_PATH:-./data}
      STORAGE_ROOT_2_CONTAINER: /storage-roots/2
      STORAGE_ROOT_3_HOST: ${LAYERVAULT_MODELS_PATH:-./data/files}
      STORAGE_ROOT_3_CONTAINER: /storage-roots/3
      STORAGE_ROOT_4_HOST: ${LAYERVAULT_BACKUPS_PATH:-./data/backups}
      STORAGE_ROOT_4_CONTAINER: /storage-roots/4
      LAYERVAULT_DATA_PATH: ${LAYERVAULT_DATA_PATH:-./data}
      LAYERVAULT_DATABASE_PATH: ${LAYERVAULT_DATABASE_PATH:-./data}
      LAYERVAULT_MODELS_PATH: ${LAYERVAULT_MODELS_PATH:-./data/files}
      LAYERVAULT_BACKUPS_PATH: ${LAYERVAULT_BACKUPS_PATH:-./data/backups}
      # Optional main-app HTTP Basic auth. Leave APP_PASSWORD empty to disable.
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      # AUTO_IMPORT: "true"
    volumes:
      - type: volume
        source: layervault-storage-config
        target: /config
      - type: bind
        source: ${LAYERVAULT_DATA_PATH:-./data}
        target: /data
      - type: bind
        source: ${LAYERVAULT_DATABASE_PATH:-./data}
        target: /storage/database
      - type: bind
        source: ${LAYERVAULT_MODELS_PATH:-./data/files}
        target: /storage/models
      - type: bind
        source: ${LAYERVAULT_BACKUPS_PATH:-./data/backups}
        target: /storage/backups
      # Safe storage roots used by Settings > Apply & restart. These expose only
      # the folders selected by the administrator, never the whole host system.
      - type: bind
        source: ${LAYERVAULT_DATA_PATH:-./data}
        target: /storage-roots/1
      - type: bind
        source: ${LAYERVAULT_DATABASE_PATH:-./data}
        target: /storage-roots/2
      - type: bind
        source: ${LAYERVAULT_MODELS_PATH:-./data/files}
        target: /storage-roots/3
      - type: bind
        source: ${LAYERVAULT_BACKUPS_PATH:-./data/backups}
        target: /storage-roots/4

  sketchforge:
    image: layervault-sketchforge:local
    build:
      context: ./third_party/sketchforge
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      # Browsers load Workshop directly from this port on the Docker host.
      # Keep it reachable on the trusted LAN alongside 8088, not the internet.
      - "3004:3000"
    environment:
      SKETCHFORGE_SHARED_PROJECTS_DIR: /data/projects
      SKETCHFORGE_LEGACY_PORT: 3000
    volumes:
      - type: bind
        source: ${LAYERVAULT_DATA_PATH:-./data}/sketchforge/projects
        target: /data/projects

volumes:
  layervault-storage-config:
